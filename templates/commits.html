{% extends "base.html" %}

{% block title %}Commits - {{ project_name }} - RippleIt{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="card-title mb-0">
                            <i class="fas fa-history me-2"></i>Commits
                        </h2>
                        <p class="text-muted mb-0">{{ project_name }}</p>
                    </div>
                    <div>
                        <a href="/project/{{ project_name }}" class="btn btn-outline-primary me-2">
                            <i class="fas fa-folder me-2"></i>View Project
                        </a>
                        <a href="/projects" class="btn btn-primary">
                            <i class="fas fa-arrow-left me-2"></i>Back to Projects
                        </a>
                    </div>
                </div>
                
                <div id="commitsContainer">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading commits...</span>
                        </div>
                        <p class="mt-2 text-muted">Loading commits...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    loadCommits();
});

async function loadCommits() {
    const container = document.getElementById('commitsContainer');
    
    try {
        const response = await fetch(`/api/project/{{ project_name }}/commits`);
        const data = await response.json();
        
        if (data.success) {
            displayCommits(data.commits);
        } else {
            container.innerHTML = `
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    ${data.error || 'Failed to load commits'}
                </div>
            `;
        }
    } catch (error) {
        container.innerHTML = `
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-circle me-2"></i>
                An error occurred while loading commits
            </div>
        `;
    }
}

function displayCommits(commits) {
    const container = document.getElementById('commitsContainer');
    
    if (commits.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5">
                <i class="fas fa-git-alt fa-4x text-muted mb-4"></i>
                <h4 class="text-muted">No Commits Found</h4>
                <p class="text-muted">This project doesn't have any commits yet.</p>
            </div>
        `;
        return;
    }
    
    const commitsHtml = commits.map(commit => `
        <div class="card mb-3">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-8">
                        <h6 class="card-title mb-2">
                            <i class="fas fa-code-branch me-2"></i>
                            <span class="text-primary">${commit.short_hash}</span>
                            ${escapeHtml(commit.message)}
                        </h6>
                        <div class="d-flex align-items-center text-muted small">
                            <i class="fas fa-user me-1"></i>
                            <span class="me-3">${escapeHtml(commit.author_name)}</span>
                            <i class="fas fa-envelope me-1"></i>
                            <span class="me-3">${escapeHtml(commit.author_email)}</span>
                            <i class="fas fa-clock me-1"></i>
                            <span>${formatDate(commit.date)}</span>
                        </div>
                    </div>
                    <div class="col-md-4 text-end">
                        <button class="btn btn-sm btn-outline-secondary" onclick="copyToClipboard('${commit.hash}')" title="Copy full hash">
                            <i class="fas fa-copy me-1"></i>Copy Hash
                        </button>
                        <button class="btn btn-sm btn-outline-info" onclick="viewCommitDetails('${commit.hash}')" title="View commit details">
                            <i class="fas fa-info-circle me-1"></i>Details
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
    
    container.innerHTML = `
        <div class="mb-3">
            <h5><i class="fas fa-list me-2"></i>Recent Commits (${commits.length})</h5>
        </div>
        ${commitsHtml}
    `;
}

function formatDate(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const diffMs = now - date;
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
    const diffMinutes = Math.floor(diffMs / (1000 * 60));
    
    if (diffDays > 0) {
        return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
    } else if (diffHours > 0) {
        return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
    } else if (diffMinutes > 0) {
        return `${diffMinutes} minute${diffMinutes > 1 ? 's' : ''} ago`;
    } else {
        return 'Just now';
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
        showAlert('success', 'Hash copied to clipboard!');
    }).catch(() => {
        showAlert('danger', 'Failed to copy hash');
    });
}

function viewCommitDetails(commitHash) {
    // For now, just show an alert with the full hash
    // In a future version, this could open a modal with detailed commit info
    showAlert('info', `Commit details for: ${commitHash}`);
}

function showAlert(type, message) {
    const alertContainer = document.createElement('div');
    alertContainer.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : 'info-circle'} me-2"></i>
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
    
    document.querySelector('.card-body').insertBefore(alertContainer.firstElementChild, document.querySelector('.card-body').firstElementChild);
    
    // Auto-dismiss after 3 seconds
    setTimeout(() => {
        const alert = document.querySelector('.alert');
        if (alert) {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        }
    }, 3000);
}
</script>
{% endblock %}
